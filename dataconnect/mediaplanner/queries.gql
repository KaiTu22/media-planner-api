# List queries for every entity (confirmed 2026-10-08: Data Connect
# auto-generates a lowercase-plural root query field per @table type, e.g.
# `tags { ... }` for the Tag type -- these just select every field Code.gs's
# corresponding *_FIELDS array expects, so the new storage layer's readRows_
# equivalent can map the response straight onto the same shape the Sheets
# version returned.

query ListUsers @auth(level: NO_ACCESS) {
  users(limit: 10000) {
    email
    name
    role
    slackUserId
  }
}

query ListTags @auth(level: NO_ACCESS) {
  tags(limit: 10000) {
    id
    name
    color
    createdAt
    createdBy
  }
}

query ListHoldCos @auth(level: NO_ACCESS) {
