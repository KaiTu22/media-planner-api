# Create/update/delete mutations for every entity (confirmed 2026-10-08:
# Data Connect auto-generates <lowercaseType>_insert/_update/_delete per
# @table type, keyed by whatever field the type's @table(key: ...) names,
# "id" by default). Bulk cascade operations (_updateMany/_deleteMany, used
# by cascadeForeignKey_/deleteRowsByForeignKey_'s real call sites) are
# deliberately deferred to Phase 2, alongside the actual Code.gs rewrite --
# writing them now without the real call sites in front of me risks
# guessing the wrong field/relationship.

mutation CreateUser($email: String!, $name: String, $role: String, $slackUserId: String) @auth(level: NO_ACCESS) {
  user_insert(data: { email: $email, name: $name, role: $role, slackUserId: $slackUserId })
}
mutation UpdateUser($originalEmail: String!, $email: String, $name: String, $role: String, $slackUserId: String) @auth(level: NO_ACCESS) {
  user_update(key: { email: $originalEmail }, data: { email: $email, name: $name, role: $role, slackUserId: $slackUserId })
}
mutation DeleteUser($email: String!) @auth(level: NO_ACCESS) {
  user_delete(key: { email: $email })
}

