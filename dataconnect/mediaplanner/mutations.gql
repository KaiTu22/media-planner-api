mutation CreateAgencyHoldCoEntry($agency: String!, $holdCo: String) @auth(level: NO_ACCESS) {
  agencyHoldCo_insert(data: { agency: $agency, holdCo: $holdCo })
}
# One mutation covers both real call shapes (Code.gs's updateAgencyHoldCoEntry
# action, where originalAgency===agency and nothing renames, and its
# renameAgency action, where they differ) -- both just call the generic
# updateRecord_(sheetName, fields, 'agency', id, values), so updateRecordSql_
# can drive both through this single originalAgency-keyed mutation.
mutation RenameAgency($originalAgency: String!, $agency: String, $holdCo: String) @auth(level: NO_ACCESS) {
  agencyHoldCo_update(key: { agency: $originalAgency }, data: { agency: $agency, holdCo: $holdCo })
}
mutation DeleteAgencyHoldCoEntry($agency: String!) @auth(level: NO_ACCESS) {
  agencyHoldCo_delete(key: { agency: $agency })
}

