}

#
# _deleteMany returns only a count (Int), not the deleted rows -- unlike
# the original deleteRowsByForeignKey_, which returns the deleted rows' own
# `id` values so callers can cascade further. Phase 2's implementation
# handles this as two steps: list+filter (client-side, these are small
# lookup-ish tables) to capture the ids first, then this bulk delete.
mutation DeleteSeasonYearsByShowId($showId: String) @auth(level: NO_ACCESS) {
  seasonYear_deleteMany(where: { showId: { eq: $showId } })
}
mutation DeletePlacementMenuItemsByCategoryId($categoryId: String) @auth(level: NO_ACCESS) {
  placementMenuItem_deleteMany(where: { categoryId: { eq: $categoryId } })
}
mutation DeleteProjectFileLinksByProjectId($projectId: String) @auth(level: NO_ACCESS) {
  projectFileLink_deleteMany(where: { projectId: { eq: $projectId } })
}
mutation DeleteVersionsByProjectId($projectId: String) @auth(level: NO_ACCESS) {
  version_deleteMany(where: { projectId: { eq: $projectId } })
}
